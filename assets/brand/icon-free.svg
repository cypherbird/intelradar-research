<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Free tier">
  <style>
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { opacity: .8; transform: scale(.5); } 100% { opacity: 0; transform: scale(2.2); } }
    @media (prefers-reduced-motion: reduce) { .ping { animation: none; opacity: 0; } }
  </style>
  <rect x="1" y="1" width="70" height="70" rx="16" fill="#111a2e" stroke="#2a3758" stroke-width="2"/>
  <circle cx="36" cy="36" r="21" fill="none" stroke="#d4a64a" stroke-width="2.5"/>
  <circle cx="36" cy="36" r="12" fill="none" stroke="#d4a64a" stroke-opacity=".5" stroke-width="2"/>
  <line x1="36" y1="36" x2="51" y2="22" stroke="#ecc778" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="ping" cx="46" cy="27" r="5" fill="#34d39e"/>
  <circle cx="46" cy="27" r="3.5" fill="#34d39e"/>
</svg>
