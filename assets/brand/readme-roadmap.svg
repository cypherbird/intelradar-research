<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Roadmap: Q2 2026 Foundation, complete. Q3 2026 Research platform, complete. Q4 2026 Launch, in progress. Q1 2027 Pro Desk, next. Q2 2027 TradingView indicators, planned. Beyond: platform expansion, exploring.">
  <style>
    .progress { stroke-dasharray: 430; animation: draw 1.8s ease-out .3s both; }
    @keyframes draw { from { stroke-dashoffset: 430; } to { stroke-dashoffset: 0; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out infinite; }
    @keyframes halo { 0% { opacity: .7; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.9); } }
    .rise { animation: rise .7s ease-out both; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.5s; } .d5 { animation-delay: 1.8s; } .d6 { animation-delay: 2.1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .progress, .halo, .rise { animation: none; } .halo { opacity: 0; } }
  </style>
  <rect x=".5" y=".5" width="1279" height="299" rx="20" fill="#0e1628" stroke="#2a3758"/>
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="56" y="48" font-size="14" font-weight="700" letter-spacing="4" fill="#ecc778" text-anchor="start">ROADMAP</text>
    <text x="1224" y="48" font-size="13" fill="#6f7b94" text-anchor="end">Indicative · priorities follow research and community feedback</text>

    <line x1="110" y1="150" x2="1170" y2="150" stroke="#2a3758" stroke-width="4" stroke-linecap="round"/>
    <line class="progress" x1="110" y1="150" x2="534" y2="150" stroke="#d4a64a" stroke-width="4" stroke-linecap="round"/>

    <!-- Q2 2026 -->
    <g class="rise d1">
      <text x="110" y="116" font-size="18" font-weight="700" fill="#ecf1f8">Q2 2026</text>
      <circle cx="110" cy="150" r="11" fill="#d4a64a"/>
      <text x="110" y="196" font-size="17" font-weight="600" fill="#ecf1f8">Foundation</text>
      <text x="110" y="222" font-size="12" font-weight="700" letter-spacing="2" fill="#a6b1c6">COMPLETE</text>
    </g>
    <!-- Q3 2026 -->
    <g class="rise d2">
      <text x="322" y="116" font-size="18" font-weight="700" fill="#ecf1f8">Q3 2026</text>
      <circle cx="322" cy="150" r="11" fill="#d4a64a"/>
      <text x="322" y="196" font-size="17" font-weight="600" fill="#ecf1f8">Research platform</text>
      <text x="322" y="222" font-size="12" font-weight="700" letter-spacing="2" fill="#a6b1c6">COMPLETE</text>
    </g>
    <!-- Q4 2026 (now) -->
    <g class="rise d3">
      <text x="534" y="116" font-size="18" font-weight="700" fill="#ecc778">Q4 2026</text>
      <circle class="halo" cx="534" cy="150" r="20" fill="#d4a64a"/>
      <circle cx="534" cy="150" r="11" fill="#0e1628" stroke="#ecc778" stroke-width="4"/>
      <text x="534" y="196" font-size="17" font-weight="600" fill="#ecf1f8">Launch</text>
      <text x="534" y="222" font-size="12" font-weight="700" letter-spacing="2" fill="#34d39e">IN PROGRESS</text>
      <text x="534" y="246" font-size="13" fill="#a6b1c6">Free tier · cloud desk · website</text>
    </g>
    <!-- Q1 2027 -->
    <g class="rise d4">
      <text x="746" y="116" font-size="18" font-weight="700" fill="#a6b1c6">Q1 2027</text>
      <circle cx="746" cy="150" r="11" fill="#0e1628" stroke="#4a5878" stroke-width="3"/>
      <text x="746" y="196" font-size="17" font-weight="600" fill="#ecf1f8">Pro Desk</text>
      <text x="746" y="222" font-size="12" font-weight="700" letter-spacing="2" fill="#ecc778">NEXT</text>
    </g>
    <!-- Q2 2027 -->
    <g class="rise d5">
      <text x="958" y="116" font-size="18" font-weight="700" fill="#a6b1c6">Q2 2027</text>
      <circle cx="958" cy="150" r="11" fill="#0e1628" stroke="#4a5878" stroke-width="3"/>
      <text x="958" y="196" font-size="17" font-weight="600" fill="#ecf1f8">TradingView indicators</text>
      <text x="958" y="222" font-size="12" font-weight="700" letter-spacing="2" fill="#6c9cff">PLANNED</text>
    </g>
    <!-- Beyond -->
    <g class="rise d6">
      <text x="1170" y="116" font-size="18" font-weight="700" fill="#a6b1c6">Beyond</text>
      <circle cx="1170" cy="150" r="11" fill="#0e1628" stroke="#4a5878" stroke-width="3"/>
      <text x="1170" y="196" font-size="17" font-weight="600" fill="#ecf1f8">Platform expansion</text>
      <text x="1170" y="222" font-size="12" font-weight="700" letter-spacing="2" fill="#6c9cff">EXPLORING</text>
    </g>
  </g>
</svg>
